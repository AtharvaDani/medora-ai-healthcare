spring.application.name=AI-HealthCareApp




spring.mvc.view.suffix=.jsp

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.mail.host=smtp.gmail.com
spring.mail.port=587
server.port=${PORT:9090}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai-healtcareapp}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
jwt.secret=${JWT_SECRET:my_super_secret_key_which_is_very_secure_12345}
app.admin-password=${ADMIN_PASSWORD:admin123}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.boot.autoconfigure.mail=DEBUG
logging.level.org.springframework.security=DEBUG

#LSFB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

#multipart file size
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=0

# Feign timeout settings (in milliseconds)
feign.client.config.default.connectTimeout=900000
feign.client.config.default.readTimeout=900000
feign.client.config.default.loggerLevel=full

# ---- Added features ----
# Where the AI-Service runs
ai.service.url=${AI_SERVICE_URL:http://localhost:8081}
# Video consultation (Jitsi). Change the secret so room names cannot be guessed.
consultation.room-secret=${CONSULT_ROOM_SECRET:change-this-secret-in-production}
consultation.jitsi-domain=meet.jit.si
