spring.application.name=AI-Service
server.port=${PORT:8081}

spring.cloud.openfeign.enabled=true

# ---- AI provider (free, OpenAI-compatible API) ----
# Default: Groq (free key from https://console.groq.com/keys)
# Set your key as environment variable AI_API_KEY (recommended) or paste it below.
ai.api.key=${AI_API_KEY:}
ai.api.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
ai.api.model=${AI_MODEL:openai/gpt-oss-20b}
ai.api.temperature=0.7

spring.mvc.view.suffix=.jsp

#DMDS
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration


#LSFB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
