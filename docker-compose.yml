services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: medora
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      retries: 30
    volumes:
      - dbdata:/var/lib/mysql

  ai-service:
    build:
      context: ./Backend
      dockerfile: Dockerfile.ai
    ports: ["8081:8081"]
    environment:
      AI_API_KEY: ${AI_API_KEY}

  healthcare:
    build:
      context: ./Backend
      dockerfile: Dockerfile.healthcare
    ports: ["9090:9090"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/medora?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: rootpass
      AI_SERVICE_URL: http://ai-service:8081
      CORS_ORIGINS: http://localhost:4200

volumes:
  dbdata: